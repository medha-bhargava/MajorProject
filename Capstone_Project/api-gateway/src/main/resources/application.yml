server:
  port: ${SERVER_PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:change-this-secret-to-a-long-random-production-value}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
        - id: sales-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/sales/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: procurement-service
          uri: ${PROCUREMENT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/procurements/**
          filters:
            - StripPrefix=1
        - id: supplier-service
          uri: ${SUPPLIER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/suppliers/**
          filters:
            - StripPrefix=1
        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/shipments/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:3001}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=1
