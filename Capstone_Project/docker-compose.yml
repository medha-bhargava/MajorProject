services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 8

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smart-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 8

  api-gateway:
    build: ./api-gateway
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-to-a-long-random-production-value}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PROCUREMENT_SERVICE_URL: http://procurement-service:8087
      SUPPLIER_SERVICE_URL: http://supplier-service:8085
      SHIPMENT_SERVICE_URL: http://shipment-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:3001
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started

  auth-service:
    build: ./services/auth-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-to-a-long-random-production-value}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart}
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build: ./services/inventory-service
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  procurement-service:
    build: ./services/procurement-service
    environment:
      SERVER_PORT: 8087

  supplier-service:
    build: ./services/supplier-service
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supplier_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shipment-service:
    build: ./services/shipment-service
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smart}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-inventory-alerts@example.com}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics-service:
    build: ./services/analytics-service
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/analytics_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
