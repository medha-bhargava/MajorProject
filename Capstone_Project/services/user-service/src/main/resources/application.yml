server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${SPRING_DATASOURCE_USERNAME:smart}
    password: ${SPRING_DATASOURCE_PASSWORD:smart}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  
management:
  endpoints:
    web:
      exposure:
        include: health,info


